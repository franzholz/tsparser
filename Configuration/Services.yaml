services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Discover all extension classes cleanly using the exact directory path
  JambageCom\Tsparser\:
    resource: '../Classes/'

  # Simple and clean service definition mapping the connection pool
  JambageCom\Tsparser\TsTemplate\Controller\ConstantEditorController:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'
    public: true
